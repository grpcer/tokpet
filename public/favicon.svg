<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tokpet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b5cf0"/>
      <stop offset="1" stop-color="#ff6fae"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc089"/>
      <stop offset="1" stop-color="#ff9a4d"/>
    </linearGradient>
  </defs>
  <!-- candy game-machine chip -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- desk-pet cat face, scaled in slightly to leave a safe margin at 16px -->
  <g transform="translate(32 33) scale(.8) translate(-32 -33)">
    <!-- ears -->
    <path d="M14 18 L18 6 L26 14 Z" fill="url(#fur)"/>
    <path d="M50 18 L46 6 L38 14 Z" fill="url(#fur)"/>
    <path d="M17 16 L19 10 L23 14 Z" fill="#ff8bb0"/>
    <path d="M47 16 L45 10 L41 14 Z" fill="#ff8bb0"/>
    <!-- head -->
    <ellipse cx="32" cy="35" rx="20" ry="18" fill="url(#fur)"/>
    <!-- eyes -->
    <ellipse cx="24" cy="34" rx="2.8" ry="3.6" fill="#241d3a"/>
    <ellipse cx="40" cy="34" rx="2.8" ry="3.6" fill="#241d3a"/>
    <circle cx="24.8" cy="32.7" r="1" fill="#fff"/>
    <circle cx="40.8" cy="32.7" r="1" fill="#fff"/>
    <!-- nose -->
    <path d="M29.6 41 L34.4 41 L32 43.8 Z" fill="#ff5f93"/>
    <!-- mouth -->
    <path d="M32 43.8 Q29.6 46.4 27.4 45.2" stroke="#241d3a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M32 43.8 Q34.4 46.4 36.6 45.2" stroke="#241d3a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="20.5" cy="40" r="2.4" fill="#ff8bb0"/>
    <circle cx="43.5" cy="40" r="2.4" fill="#ff8bb0"/>
  </g>
</svg>
